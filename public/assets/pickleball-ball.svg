<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- 3D Ball Spherical Gradient -->
    <radialGradient id="ballShading" cx="38%" cy="32%" r="65%" fx="35%" fy="30%">
      <stop offset="0%" stop-color="#F7FEE7" />
      <stop offset="25%" stop-color="#D9F99D" />
      <stop offset="60%" stop-color="#A3E635" />
      <stop offset="85%" stop-color="#65A30D" />
      <stop offset="100%" stop-color="#365314" />
    </radialGradient>
    
    <!-- Hole Inner Shadow Gradient -->
    <radialGradient id="holeDepth" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#14532D" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#052E16" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.8" />
    </radialGradient>

    <!-- Outer Glow / Shadow -->
    <filter id="ballGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-color="#14532d" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Ball Body with Glow -->
  <circle cx="50" cy="50" r="44" fill="url(#ballShading)" filter="url(#ballGlow)" stroke="#4d7c0f" stroke-width="1.5" />

  <!-- Specular Surface Highlight (Top-Left Gloss) -->
  <ellipse cx="38" cy="30" rx="18" ry="11" transform="rotate(-25 38 30)" fill="#ffffff" opacity="0.45" />

  <!-- Perforated Holes (Accurate 3D Pickleball Layout) -->
  <!-- Center & Inner Ring -->
  <g fill="url(#holeDepth)" stroke="#84cc16" stroke-width="0.8" stroke-opacity="0.6">
    <!-- Center Hole -->
    <circle cx="50" cy="50" r="5.2" />
    <!-- Inner Ring -->
    <circle cx="50" cy="32" r="4.8" />
    <circle cx="65" cy="40" r="4.8" />
    <circle cx="63" cy="58" r="4.8" />
    <circle cx="50" cy="68" r="4.8" />
    <circle cx="36" cy="59" r="4.8" />
    <circle cx="35" cy="41" r="4.8" />

    <!-- Outer Ring (Perspective Perspective) -->
    <ellipse cx="50" cy="18" rx="4.5" ry="3.8" />
    <ellipse cx="68" cy="24" rx="4.2" ry="3.6" transform="rotate(15 68 24)" />
    <ellipse cx="79" cy="37" rx="3.6" ry="4.4" />
    <ellipse cx="80" cy="55" rx="3.5" ry="4.4" />
    <ellipse cx="73" cy="71" rx="4.2" ry="3.8" transform="rotate(-20 73 71)" />
    <ellipse cx="57" cy="80" rx="4.5" ry="3.8" />
    <ellipse cx="38" cy="80" rx="4.5" ry="3.8" />
    <ellipse cx="23" cy="71" rx="4.2" ry="3.8" transform="rotate(20 23 71)" />
    <ellipse cx="18" cy="54" rx="3.5" ry="4.4" />
    <ellipse cx="19" cy="36" rx="3.5" ry="4.4" />
    <ellipse cx="31" cy="22" rx="4.2" ry="3.6" transform="rotate(-15 31 22)" />
  </g>

  <!-- Hole Inner Rim Highlights for 3D realism -->
  <g fill="none" stroke="#bef264" stroke-width="0.75" opacity="0.8">
    <path d="M 46 52 A 5 5 0 0 0 54 52" />
    <path d="M 46 34 A 4.5 4.5 0 0 0 54 34" />
    <path d="M 61 42 A 4.5 4.5 0 0 0 69 42" />
    <path d="M 59 60 A 4.5 4.5 0 0 0 67 60" />
    <path d="M 46 70 A 4.5 4.5 0 0 0 54 70" />
    <path d="M 32 61 A 4.5 4.5 0 0 0 40 61" />
    <path d="M 31 43 A 4.5 4.5 0 0 0 39 43" />
  </g>
</svg>
