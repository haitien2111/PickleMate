<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="cmbPaddleFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cmbGrip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <radialGradient id="cmbBallShading" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#f7fee7" />
      <stop offset="25%" stop-color="#d9f99d" />
      <stop offset="65%" stop-color="#a3e635" />
      <stop offset="90%" stop-color="#65a30d" />
      <stop offset="100%" stop-color="#365314" />
    </radialGradient>
    <filter id="cmbShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Paddle in background -->
  <g transform="rotate(-18 42 48)" filter="url(#cmbShadow)">
    <!-- Edge guard -->
    <rect x="16" y="8" width="52" height="54" rx="18" fill="#020617" stroke="#334155" stroke-width="1.2" />
    <!-- Paddle face -->
    <rect x="19" y="11" width="46" height="48" rx="15" fill="url(#cmbPaddleFace)" />
    <!-- Subtle carbon weave lines -->
    <path d="M 21 28 Q 42 22 63 28" stroke="#84cc16" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8" />
    <!-- Neck -->
    <path d="M 37 62 L 35 68 L 49 68 L 47 62 Z" fill="#020617" />
    <!-- Grip -->
    <rect x="36" y="67" width="12" height="24" rx="3" fill="url(#cmbGrip)" stroke="#0f172a" stroke-width="1" />
    <line x1="36" y1="72" x2="48" y2="75" stroke="#0f172a" stroke-width="1.5" />
    <line x1="36" y1="78" x2="48" y2="81" stroke="#0f172a" stroke-width="1.5" />
    <line x1="36" y1="84" x2="48" y2="87" stroke="#0f172a" stroke-width="1.5" />
    <!-- Cap -->
    <rect x="34" y="88" width="16" height="3.5" rx="1.5" fill="#84cc16" />
  </g>

  <!-- 3D Perforated Pickleball overlapping front-right -->
  <g filter="url(#cmbShadow)">
    <circle cx="64" cy="54" r="25" fill="url(#cmbBallShading)" stroke="#4d7c0f" stroke-width="1.2" />
    <!-- Specular light -->
    <ellipse cx="58" cy="42" rx="9" ry="5.5" transform="rotate(-30 58 42)" fill="#ffffff" opacity="0.5" />
    <!-- Characteristic Holes -->
    <g fill="#14532d" stroke="#84cc16" stroke-width="0.5" opacity="0.9">
      <circle cx="64" cy="54" r="3.2" />
      <circle cx="63" cy="43" r="2.8" />
      <circle cx="73" cy="47" r="2.8" />
      <circle cx="74" cy="58" r="2.8" />
      <circle cx="65" cy="65" r="2.8" />
      <circle cx="55" cy="60" r="2.8" />
      <circle cx="54" cy="48" r="2.8" />
      <ellipse cx="78" cy="39" rx="2" ry="2.5" />
      <ellipse cx="84" cy="51" rx="1.8" ry="2.6" />
      <ellipse cx="78" cy="67" rx="2" ry="2.4" />
      <ellipse cx="53" cy="70" rx="2.2" ry="1.8" />
      <ellipse cx="44" cy="58" rx="1.8" ry="2.4" />
    </g>
  </g>
</svg>
