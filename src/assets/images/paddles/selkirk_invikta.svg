<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <radialGradient id="bgGradSelkirk" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </radialGradient>

    <!-- Carbon Fiber 4x QuadFlex Weave -->
    <pattern id="selkirkCarbon" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#1e1e24" />
      <path d="M0,0 L8,8 M8,0 L0,8" stroke="#121216" stroke-width="1.2" />
      <rect x="2" y="2" width="4" height="4" fill="#2a2a32" />
    </pattern>

    <!-- Selkirk Vibrant Red Aero Gradient -->
    <linearGradient id="selkirkRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <!-- Edgeless Bevel Outer Stroke -->
    <linearGradient id="edgelessBevel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3f3f46" />
      <stop offset="50%" stop-color="#71717a" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>

    <!-- Black Hex Grip Pattern -->
    <pattern id="hexGrip" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#18181b" />
      <path d="M0,0 L12,12 M12,0 L0,12" stroke="#27272a" stroke-width="0.75" />
    </pattern>

    <filter id="floorShadowSelkirk" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16" />
      <feOffset dx="8" dy="24" result="offsetblur" />
      <feFlood flood-color="#0f172a" flood-opacity="0.22" />
      <feComposite in2="offsetblur" operator="in" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="highlightGlossSelkirk" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="url(#bgGradSelkirk)" />
  <ellipse cx="300" cy="405" rx="140" ry="14" fill="#64748b" opacity="0.12" filter="blur(8px)" />

  <g transform="rotate(-8 300 230)" filter="url(#floorShadowSelkirk)">
    <!-- HANDLE -->
    <g id="handleSelkirk">
      <path d="M 285 285 L 315 285 L 312 414 L 288 414 Z" fill="url(#hexGrip)" stroke="#27272a" stroke-width="1" />
      <!-- Red Accent Ribbons -->
      <line x1="285" y1="305" x2="315" y2="317" stroke="#3f3f46" stroke-width="1.8" />
      <line x1="286" y1="327" x2="314" y2="339" stroke="#3f3f46" stroke-width="1.8" />
      <line x1="286" y1="349" x2="314" y2="361" stroke="#3f3f46" stroke-width="1.8" />
      <line x1="287" y1="371" x2="313" y2="383" stroke="#3f3f46" stroke-width="1.8" />
      <line x1="287" y1="393" x2="313" y2="405" stroke="#3f3f46" stroke-width="1.8" />

      <!-- Selkirk Red Finishing Collar -->
      <rect x="283" y="280" width="34" height="8" rx="2" fill="#dc2626" />
      <text x="300" y="286" fill="#ffffff" font-size="4.5" font-family="'Arial Black', sans-serif" font-weight="900" text-anchor="middle" letter-spacing="1">SELKIRK</text>

      <!-- Red Butt Cap -->
      <rect x="287" y="413" width="26" height="7" rx="2" fill="#b91c1c" />
    </g>

    <!-- MAIN PADDLE HEAD (EDGELESS AERO DESIGN) -->
    <!-- Outer Contour with Smooth Bevel -->
    <rect x="210" y="38" width="180" height="248" rx="46" fill="url(#selkirkCarbon)" stroke="url(#edgelessBevel)" stroke-width="2.5" />

    <!-- Specular Highlight -->
    <rect x="210" y="38" width="180" height="248" rx="46" fill="url(#highlightGlossSelkirk)" />

    <!-- Signature Selkirk Red & White Swooshes -->
    <path d="M 215 120 C 260 100, 310 160, 385 110 L 388 180 C 320 220, 260 170, 215 190 Z" fill="url(#selkirkRed)" opacity="0.9" />
    <path d="M 216 114 C 265 96, 315 154, 386 104" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85" />
    <path d="M 218 196 C 265 174, 325 224, 387 186" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />

    <!-- Selkirk Modern Typographic Brand -->
    <g transform="translate(245, 80)">
      <text x="0" y="0" fill="#ffffff" font-size="16" font-family="'Arial Black', sans-serif" font-weight="900" letter-spacing="3">SELKIRK</text>
      <text x="0" y="14" fill="#fca5a5" font-size="6.5" font-family="'Arial', sans-serif" font-weight="800" letter-spacing="1.5">VANGUARD POWER AIR</text>
    </g>

    <!-- INVIKTA Badge -->
    <rect x="330" y="68" width="46" height="15" rx="3" fill="#09090b" stroke="#ef4444" stroke-width="1" />
    <text x="353" y="78.5" fill="#ffffff" font-size="6" font-family="'Arial Black', sans-serif" font-weight="900" text-anchor="middle" letter-spacing="1">INVIKTA</text>

    <!-- THE FAMOUS AIR DYNAMIC THROAT (AERODYNAMIC CUTOUT HOLE!) -->
    <!-- Hole outer shadow to show true cutout depth through background -->
    <ellipse cx="300" cy="254" rx="28" ry="12" fill="#cbd5e1" stroke="#09090b" stroke-width="3.5" />
    <ellipse cx="300" cy="254" rx="26" ry="10.5" fill="url(#bgGradSelkirk)" />
    <!-- Depth shadow rim inside hole -->
    <path d="M 274 254 A 26 10.5 0 0 1 326 254" stroke="#475569" stroke-width="2.2" fill="none" />

    <text x="300" y="240" fill="#fca5a5" font-size="5" font-family="'Arial', sans-serif" font-weight="800" text-anchor="middle" letter-spacing="1">AIR DYNAMIC THROAT</text>

    <!-- ProSpin+ Specs -->
    <text x="300" y="218" fill="#e2e8f0" font-size="6" font-family="'Arial', sans-serif" font-weight="700" text-anchor="middle" letter-spacing="1">PROSPIN+ TEXTURE • SUPERCORE</text>
  </g>
</svg>
