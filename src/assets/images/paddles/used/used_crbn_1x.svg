<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Inspection surface -->
    <linearGradient id="usedCrbnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Raw Toray T700 Weave Pattern -->
    <pattern id="crbnWeaveUsed" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#111111"/>
      <line x1="0" y1="4" x2="8" y2="4" stroke="#1c1917" stroke-width="3"/>
      <line x1="4" y1="0" x2="4" y2="8" stroke="#262626" stroke-width="3"/>
    </pattern>

    <!-- Wilson Pro White Overgrip with slight player wrap ridges -->
    <linearGradient id="wilsonGrip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="40%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <filter id="crbnShadowUsed" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Mat -->
  <rect width="400" height="400" rx="16" fill="url(#usedCrbnBg)"/>

  <!-- Ruler scale markings on right -->
  <g stroke="#475569" stroke-width="0.8" opacity="0.5">
    <line x1="375" y1="20" x2="375" y2="380"/>
    <line x1="375" y1="40" x2="367" y2="40"/>
    <line x1="375" y1="80" x2="363" y2="80"/>
    <line x1="375" y1="120" x2="367" y2="120"/>
    <line x1="375" y1="160" x2="363" y2="160"/>
    <line x1="375" y1="200" x2="367" y2="200"/>
    <line x1="375" y1="240" x2="363" y2="240"/>
    <line x1="375" y1="280" x2="367" y2="280"/>
    <line x1="375" y1="320" x2="363" y2="320"/>
  </g>

  <!-- Watermark -->
  <text x="200" y="385" text-anchor="middle" font-family="'Lexend', sans-serif" font-size="8" font-weight="700" fill="#64748b" letter-spacing="1">
    PICKLEMATE VERIFIED INSPECTION • SÀN VỢT CŨ PASS LẠI
  </text>

  <!-- Paddle Group (Stealth Matte Black, slightly rotated) -->
  <g transform="rotate(-2 200 200)" filter="url(#crbnShadowUsed)">
    <!-- Handle (Wilson Pro White overgrip wrap) -->
    <rect x="187" y="240" width="26" height="115" rx="5" fill="url(#wilsonGrip)"/>
    <!-- Wrap ridges -->
    <line x1="187" y1="256" x2="213" y2="264" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="187" y1="274" x2="213" y2="282" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="187" y1="292" x2="213" y2="300" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="187" y1="310" x2="213" y2="318" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="187" y1="328" x2="213" y2="336" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Black finishing tape -->
    <rect x="185" y="238" width="30" height="8" rx="1" fill="#09090b"/>
    <text x="200" y="244" text-anchor="middle" font-family="sans-serif" font-size="4" font-weight="bold" fill="#f8fafc">WILSON</text>

    <!-- Butt cap -->
    <rect x="184" y="350" width="32" height="9" rx="3" fill="#18181b" stroke="#333333" stroke-width="0.8"/>

    <!-- Unibody throat transition -->
    <polygon points="187,242 165,212 235,212 213,242" fill="#0f0f10"/>

    <!-- Elongated Square-Shoulder Outer Edge Guard (Matte Black) -->
    <rect x="122" y="38" width="156" height="182" rx="32" fill="#050505" stroke="#262626" stroke-width="2.5"/>

    <!-- Face (Raw Carbon T700 with used sweetspot halo) -->
    <rect x="127" y="43" width="146" height="172" rx="27" fill="url(#crbnWeaveUsed)"/>

    <!-- Subtle sweetspot contact mark -->
    <ellipse cx="200" cy="120" rx="30" ry="30" fill="#ffffff" fill-opacity="0.03"/>

    <!-- Minimalist Lowercase "crbn" typography -->
    <text x="200" y="115" text-anchor="middle" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="-1">
      crbn
    </text>

    <!-- Model Tag -->
    <text x="200" y="138" text-anchor="middle" font-family="'Lexend', sans-serif" font-size="9" font-weight="800" fill="#e2e8f0" letter-spacing="2">
      1X POWER SERIES
    </text>
    <text x="200" y="152" text-anchor="middle" font-family="'Lexend', sans-serif" font-size="7" font-weight="600" fill="#78716c">
      14MM ELONGATED • TORAY T700
    </text>
  </g>

  <!-- Pre-Owned Badge (Chợ Vợt Cũ) -->
  <g transform="translate(24, 24)">
    <rect width="118" height="42" rx="8" fill="#09090b" fill-opacity="0.9" stroke="#10b981" stroke-width="1.2"/>
    <circle cx="16" cy="16" r="6" fill="#10b981"/>
    <text x="16" y="18.5" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="900" fill="#09090b">✓</text>
    <text x="28" y="15" font-family="'Lexend', sans-serif" font-size="8.5" font-weight="800" fill="#a7f3d0">
      VỢT CŨ • 95%
    </text>
    <text x="28" y="24" font-family="'Lexend', sans-serif" font-size="6.5" font-weight="500" fill="#cbd5e1">
      Lướt 2 trận • Như mới bóc hộp
    </text>
    <text x="10" y="35" font-family="'Lexend', sans-serif" font-size="6" font-weight="700" fill="#38bdf8">
      # ẢNH CHỤP KIỂM ĐỊNH THỰC TẾ
    </text>
  </g>
</svg>
