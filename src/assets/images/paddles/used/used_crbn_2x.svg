<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="crbn2xBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="60%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <filter id="crbn2xShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="400" height="400" rx="16" fill="url(#crbn2xBg)"/>

  <!-- Ruler scale markings -->
  <g stroke="#52525b" stroke-width="0.8" opacity="0.4">
    <line x1="20" y1="20" x2="20" y2="380"/>
    <line x1="20" y1="60" x2="28" y2="60"/>
    <line x1="20" y1="120" x2="32" y2="120"/>
    <line x1="20" y1="180" x2="28" y2="180"/>
    <line x1="20" y1="240" x2="32" y2="240"/>
    <line x1="20" y1="300" x2="28" y2="300"/>
  </g>

  <text x="200" y="385" text-anchor="middle" font-family="'Lexend', sans-serif" font-size="8" font-weight="700" fill="#71717a" letter-spacing="1">
    PICKLEMATE VERIFIED INSPECTION • SÀN VỢT CŨ PASS LẠI
  </text>

  <!-- Paddle Group (Square Shoulder CRBN 2X) -->
  <g transform="rotate(2 200 200)" filter="url(#crbn2xShadow)">
    <rect x="187" y="240" width="26" height="115" rx="5" fill="#e4e4e7"/>
    <line x1="187" y1="256" x2="213" y2="264" stroke="#71717a" stroke-width="1.5"/>
    <line x1="187" y1="274" x2="213" y2="282" stroke="#71717a" stroke-width="1.5"/>
    <line x1="187" y1="292" x2="213" y2="300" stroke="#71717a" stroke-width="1.5"/>
    <line x1="187" y1="310" x2="213" y2="318" stroke="#71717a" stroke-width="1.5"/>
    <line x1="187" y1="328" x2="213" y2="336" stroke="#71717a" stroke-width="1.5"/>

    <rect x="185" y="238" width="30" height="8" rx="1" fill="#18181b"/>
    <rect x="185" y="350" width="30" height="8" rx="3" fill="#27272a"/>

    <polygon points="187,242 160,212 240,212 213,242" fill="#18181b"/>

    <!-- Square Head Face (CRBN 2X Series) -->
    <rect x="115" y="42" width="170" height="174" rx="28" fill="#09090b" stroke="#3f3f46" stroke-width="2.5"/>
    <rect x="120" y="47" width="160" height="164" rx="23" fill="#18181b"/>

    <!-- Lead tape at corners (Chì dán góc 10h và 2h) -->
    <rect x="125" y="55" width="22" height="6" rx="1.5" fill="#a1a1aa"/>
    <rect x="253" y="55" width="22" height="6" rx="1.5" fill="#a1a1aa"/>

    <text x="200" y="118" text-anchor="middle" font-family="'Helvetica Neue', sans-serif" font-size="28" font-weight="900" fill="#ffffff">
      crbn
    </text>
    <text x="200" y="140" text-anchor="middle" font-family="'Lexend', sans-serif" font-size="9" font-weight="800" fill="#cbd5e1" letter-spacing="1">
      2X SQUARE POWER
    </text>
    <text x="200" y="152" text-anchor="middle" font-family="'Lexend', sans-serif" font-size="7" font-weight="600" fill="#71717a">
      16MM WIDE SWEETSPOT
    </text>
  </g>

  <!-- Pre-Owned Badge -->
  <g transform="translate(24, 24)">
    <rect width="120" height="42" rx="8" fill="#09090b" fill-opacity="0.9" stroke="#f59e0b" stroke-width="1.2"/>
    <circle cx="16" cy="16" r="6" fill="#f59e0b"/>
    <text x="16" y="18.5" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="900" fill="#09090b">✓</text>
    <text x="28" y="15" font-family="'Lexend', sans-serif" font-size="8.5" font-weight="800" fill="#fde68a">
      VỢT CŨ • 85%
    </text>
    <text x="28" y="24" font-family="'Lexend', sans-serif" font-size="6.5" font-weight="500" fill="#cbd5e1">
      Mặt vuông • Đã dán chì góc
    </text>
    <text x="10" y="35" font-family="'Lexend', sans-serif" font-size="6" font-weight="700" fill="#38bdf8">
      # ẢNH CHỤP KIỂM ĐỊNH THỰC TẾ
    </text>
  </g>
</svg>
