<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="diademBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#134e4a"/>
      <stop offset="60%" stop-color="#042f2e"/>
      <stop offset="100%" stop-color="#021c1a"/>
    </linearGradient>
    <filter id="diademShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="400" height="400" rx="16" fill="url(#diademBg)"/>

  <text x="200" y="385" text-anchor="middle" font-family="'Lexend', sans-serif" font-size="8" font-weight="700" fill="#5eead4" letter-spacing="1">
    PICKLEMATE VERIFIED INSPECTION • SÀN VỢT CŨ PASS LẠI
  </text>

  <g transform="rotate(-3 200 200)" filter="url(#diademShadow)">
    <!-- Grip Teal -->
    <rect x="187" y="240" width="26" height="115" rx="5" fill="#14b8a6"/>
    <line x1="187" y1="256" x2="213" y2="264" stroke="#0f766e" stroke-width="1.5"/>
    <line x1="187" y1="274" x2="213" y2="282" stroke="#0f766e" stroke-width="1.5"/>
    <line x1="187" y1="292" x2="213" y2="300" stroke="#0f766e" stroke-width="1.5"/>
    <line x1="187" y1="310" x2="213" y2="317" stroke="#0f766e" stroke-width="1.5"/>
    <line x1="187" y1="328" x2="213" y2="335" stroke="#0f766e" stroke-width="1.5"/>

    <rect x="185" y="238" width="30" height="8" rx="1" fill="#09090b"/>
    <rect x="185" y="350" width="30" height="8" rx="3" fill="#134e4a"/>

    <polygon points="187,242 165,212 235,212 213,242" fill="#18181b"/>

    <rect x="122" y="40" width="156" height="180" rx="40" fill="#09090b" stroke="#14b8a6" stroke-width="2"/>
    <rect x="126" y="44" width="148" height="172" rx="36" fill="#18181b"/>

    <!-- 18K Triaxial weave visual representation -->
    <circle cx="200" cy="115" r="35" fill="none" stroke="#2dd4bf" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>

    <!-- Diadem Star Logo -->
    <polygon points="200,75 205,92 222,92 208,103 213,120 200,109 187,120 192,103 178,92 195,92" fill="#2dd4bf"/>

    <text x="200" y="138" text-anchor="middle" font-family="'Impact', sans-serif" font-size="20" font-weight="900" fill="#ffffff" letter-spacing="2">
      DIADEM
    </text>
    <text x="200" y="152" text-anchor="middle" font-family="'Lexend', sans-serif" font-size="9" font-weight="800" fill="#99f6e4" letter-spacing="1">
      EDGE 18K SPEED
    </text>
    <text x="200" y="163" text-anchor="middle" font-family="'Lexend', sans-serif" font-size="6.5" font-weight="600" fill="#cbd5e1">
      TRIAXIAL CARBON FIBER
    </text>
  </g>

  <!-- Pre-Owned Badge -->
  <g transform="translate(24, 24)">
    <rect width="120" height="42" rx="8" fill="#09090b" fill-opacity="0.9" stroke="#14b8a6" stroke-width="1.2"/>
    <circle cx="16" cy="16" r="6" fill="#14b8a6"/>
    <text x="16" y="18.5" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="900" fill="#09090b">✓</text>
    <text x="28" y="15" font-family="'Lexend', sans-serif" font-size="8.5" font-weight="800" fill="#99f6e4">
      VỢT CŨ • 91%
    </text>
    <text x="28" y="24" font-family="'Lexend', sans-serif" font-size="6.5" font-weight="500" fill="#cbd5e1">
      Sợi 18K nguyên vẹn • Cán Teal
    </text>
    <text x="10" y="35" font-family="'Lexend', sans-serif" font-size="6" font-weight="700" fill="#38bdf8">
      # ẢNH CHỤP KIỂM ĐỊNH THỰC TẾ
    </text>
  </g>
</svg>
