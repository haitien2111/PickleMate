<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="gearboxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="60%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="gearboxShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="400" height="400" rx="16" fill="url(#gearboxBg)"/>

  <text x="200" y="385" text-anchor="middle" font-family="'Lexend', sans-serif" font-size="8" font-weight="700" fill="#a1a1aa" letter-spacing="1">
    PICKLEMATE VERIFIED INSPECTION • SÀN VỢT CŨ PASS LẠI
  </text>

  <!-- Paddle Group (Edgeless Gearbox Pro Power Elongated) -->
  <g transform="rotate(3 200 200)" filter="url(#gearboxShadow)">
    <rect x="187" y="240" width="26" height="115" rx="5" fill="#f43f5e"/>
    <line x1="187" y1="256" x2="213" y2="264" stroke="#be123c" stroke-width="1.5"/>
    <line x1="187" y1="274" x2="213" y2="282" stroke="#be123c" stroke-width="1.5"/>
    <line x1="187" y1="292" x2="213" y2="300" stroke="#be123c" stroke-width="1.5"/>
    <line x1="187" y1="310" x2="213" y2="318" stroke="#be123c" stroke-width="1.5"/>
    <line x1="187" y1="328" x2="213" y2="336" stroke="#be123c" stroke-width="1.5"/>

    <rect x="185" y="238" width="30" height="8" rx="1" fill="#09090b"/>
    <rect x="185" y="350" width="30" height="8" rx="3" fill="#18181b"/>

    <polygon points="187,242 165,212 235,212 213,242" fill="#09090b"/>

    <!-- Edgeless SST Solid Ribbed Carbon Body -->
    <path d="M 130,55 C 130,35 150,32 200,32 C 250,32 270,35 270,55 L 270,185 C 270,205 250,215 235,215 L 165,215 C 150,215 130,205 130,185 Z" fill="#09090b" stroke="#f43f5e" stroke-width="1.8"/>

    <!-- Subtle edge tape applied by player -->
    <path d="M 130 55 Q 130 85 131 110" stroke="#fb7185" stroke-width="2.5" fill="none" opacity="0.8"/>

    <!-- Gearbox Ribbed lines -->
    <line x1="150" y1="70" x2="250" y2="70" stroke="#27272a" stroke-width="2"/>
    <line x1="145" y1="85" x2="255" y2="85" stroke="#27272a" stroke-width="2"/>
    <line x1="145" y1="165" x2="255" y2="165" stroke="#27272a" stroke-width="2"/>
    <line x1="150" y1="180" x2="250" y2="180" stroke="#27272a" stroke-width="2"/>

    <text x="200" y="115" text-anchor="middle" font-family="'Impact', sans-serif" font-size="22" font-weight="900" fill="#ffffff" letter-spacing="2">
      GEARBOX
    </text>
    <text x="200" y="132" text-anchor="middle" font-family="'Lexend', sans-serif" font-size="9" font-weight="800" fill="#fda4af" letter-spacing="1">
      PRO POWER ELONGATED
    </text>
    <text x="200" y="145" text-anchor="middle" font-family="'Lexend', sans-serif" font-size="6.5" font-weight="600" fill="#94a3b8">
      PATENTED SST RIBBED CORE
    </text>
  </g>

  <!-- Pre-Owned Badge -->
  <g transform="translate(24, 24)">
    <rect width="120" height="42" rx="8" fill="#09090b" fill-opacity="0.9" stroke="#10b981" stroke-width="1.2"/>
    <circle cx="16" cy="16" r="6" fill="#10b981"/>
    <text x="16" y="18.5" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="900" fill="#09090b">✓</text>
    <text x="28" y="15" font-family="'Lexend', sans-serif" font-size="8.5" font-weight="800" fill="#a7f3d0">
      VỢT CŨ • 94%
    </text>
    <text x="28" y="24" font-family="'Lexend', sans-serif" font-size="6.5" font-weight="500" fill="#cbd5e1">
      Khung liền khối • Không dập gãy
    </text>
    <text x="10" y="35" font-family="'Lexend', sans-serif" font-size="6" font-weight="700" fill="#38bdf8">
      # ẢNH CHỤP KIỂM ĐỊNH THỰC TẾ
    </text>
  </g>
</svg>
