<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Inspection mat / real background -->
    <linearGradient id="matGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Grid pattern for inspection mat -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.4"/>
    </pattern>

    <!-- Carbon weave with subtle play patina -->
    <pattern id="usedCarbon" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#18181b"/>
      <rect width="3" height="3" fill="#27272a"/>
      <rect x="3" y="3" width="3" height="3" fill="#27272a"/>
    </pattern>

    <!-- Blue Tourna Grip gradient (showing play wrap) -->
    <linearGradient id="tournaGrip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="35%" stop-color="#60a5fa"/>
      <stop offset="70%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Shadow -->
    <filter id="paddleShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background: Inspection Table Mat with Ruler Grid -->
  <rect width="400" height="400" rx="16" fill="url(#matGrad)"/>
  <rect width="400" height="400" rx="16" fill="url(#grid)"/>

  <!-- Ruler scale markings on left & top -->
  <g stroke="#64748b" stroke-width="0.8" opacity="0.6">
    <line x1="20" y1="20" x2="20" y2="380"/>
    <line x1="20" y1="40" x2="28" y2="40"/>
    <line x1="20" y1="80" x2="32" y2="80"/>
    <line x1="20" y1="120" x2="28" y2="120"/>
    <line x1="20" y1="160" x2="32" y2="160"/>
    <line x1="20" y1="200" x2="28" y2="200"/>
    <line x1="20" y1="240" x2="32" y2="240"/>
    <line x1="20" y1="280" x2="28" y2="280"/>
    <line x1="20" y1="320" x2="32" y2="320"/>
    <line x1="20" y1="360" x2="28" y2="360"/>
  </g>

  <!-- Watermark: PickleMate Inspection Center -->
  <text x="200" y="385" text-anchor="middle" font-family="'Lexend', sans-serif" font-size="8" font-weight="700" fill="#475569" letter-spacing="1">
    PICKLEMATE VERIFIED INSPECTION STATION • REAL PHOTO
  </text>

  <!-- Paddle Group (Angled 5 deg for realistic amateur photography) -->
  <g transform="rotate(-3 200 200)" filter="url(#paddleShadow)">
    <!-- Handle (Wrapped in iconic Blue Tourna Grip with player overlap lines) -->
    <rect x="187" y="240" width="26" height="115" rx="5" fill="url(#tournaGrip)"/>
    <!-- Overgrip spiral ridges -->
    <line x1="187" y1="255" x2="213" y2="262" stroke="#1d4ed8" stroke-width="1.8"/>
    <line x1="187" y1="272" x2="213" y2="279" stroke="#1d4ed8" stroke-width="1.8"/>
    <line x1="187" y1="289" x2="213" y2="296" stroke="#1d4ed8" stroke-width="1.8"/>
    <line x1="187" y1="306" x2="213" y2="313" stroke="#1d4ed8" stroke-width="1.8"/>
    <line x1="187" y1="323" x2="213" y2="330" stroke="#1d4ed8" stroke-width="1.8"/>
    <line x1="187" y1="340" x2="213" y2="347" stroke="#1d4ed8" stroke-width="1.8"/>

    <!-- Black electrical finishing tape at top of grip -->
    <rect x="185" y="238" width="30" height="9" rx="1.5" fill="#09090b" stroke="#27272a" stroke-width="0.5"/>
    <text x="200" y="244.5" text-anchor="middle" font-family="sans-serif" font-size="4.5" font-weight="bold" fill="#e2e8f0">TOURNA</text>

    <!-- Butt cap -->
    <rect x="184" y="350" width="32" height="9" rx="3" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>

    <!-- Throat reinforcement -->
    <polygon points="187,242 165,215 235,215 213,242" fill="#18181b"/>

    <!-- Paddle Face Outer Edge Guard (Dark charcoal with battle wear) -->
    <rect x="120" y="42" width="160" height="178" rx="42" fill="#09090b" stroke="#3f3f46" stroke-width="2.5"/>

    <!-- Used Battle Scuffs on Top Edge Guard (Vết trầy xước nhẹ góc đầu vợt) -->
    <path d="M 140 45 Q 160 42 180 44" stroke="#71717a" stroke-width="1.5" stroke-dasharray="4,2" fill="none"/>
    <path d="M 220 44 Q 240 43 255 48" stroke="#a1a1aa" stroke-width="1.2" stroke-dasharray="3,3" fill="none"/>

    <!-- Paddle Face (Raw Toray T700 Carbon) -->
    <rect x="125" y="47" width="150" height="168" rx="37" fill="url(#usedCarbon)"/>

    <!-- Sweetspot ball wear shadow (Vệt bóng nảy tự nhiên ở trung tâm) -->
    <ellipse cx="200" cy="120" rx="36" ry="32" fill="#ffffff" fill-opacity="0.04"/>

    <!-- Lead Tape Additions at 3 o'clock & 9 o'clock (Chì dán trợ lực thực tế của người chơi) -->
    <rect x="121" y="105" width="5" height="30" rx="1.5" fill="#94a3b8" stroke="#475569" stroke-width="0.5"/>
    <text x="123.5" y="122" text-anchor="middle" transform="rotate(-90 123.5 122)" font-family="sans-serif" font-size="3.5" font-weight="bold" fill="#0f172a">3g LEAD</text>
    
    <rect x="274" y="105" width="5" height="30" rx="1.5" fill="#94a3b8" stroke="#475569" stroke-width="0.5"/>
    <text x="276.5" y="122" text-anchor="middle" transform="rotate(90 276.5 122)" font-family="sans-serif" font-size="3.5" font-weight="bold" fill="#0f172a">3g LEAD</text>

    <!-- JOOLA Triangle Logo (Authentic geometry with slight surface patina) -->
    <polygon points="200,68 174,106 226,106" fill="none" stroke="#f8fafc" stroke-width="6.5" stroke-linejoin="round"/>
    <circle cx="200" cy="88" r="4.5" fill="#f8fafc"/>

    <!-- Brand Typography -->
    <text x="200" y="130" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-size="19" font-weight="900" fill="#ffffff" letter-spacing="2">
      JOOLA
    </text>

    <!-- Model Name -->
    <text x="200" y="145" text-anchor="middle" font-family="'Lexend', sans-serif" font-size="8.5" font-weight="700" fill="#cbd5e1" letter-spacing="0.5">
      BEN JOHNS PERSEUS
    </text>
    <text x="200" y="156" text-anchor="middle" font-family="'Lexend', sans-serif" font-size="6.5" font-weight="500" fill="#94a3b8">
      CFS 16MM SWIFT
    </text>

    <!-- USAPA Approved Stamp -->
    <rect x="178" y="185" width="44" height="12" rx="3" fill="#0f172a" stroke="#475569" stroke-width="0.8"/>
    <text x="200" y="193" text-anchor="middle" font-family="sans-serif" font-size="5" font-weight="bold" fill="#cbd5e1">
      USA PICKLEBALL
    </text>
  </g>

  <!-- Authentic Pre-Owned Inspection Badge Overlay (Chợ Vợt Cũ) -->
  <g transform="translate(24, 24)">
    <rect width="115" height="42" rx="8" fill="#09090b" fill-opacity="0.9" stroke="#eab308" stroke-width="1.2"/>
    <circle cx="16" cy="16" r="6" fill="#eab308"/>
    <text x="16" y="18.5" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="900" fill="#09090b">✓</text>
    <text x="28" y="15" font-family="'Lexend', sans-serif" font-size="8.5" font-weight="800" fill="#fef08a">
      VỢT CŨ • 90%
    </text>
    <text x="28" y="24" font-family="'Lexend', sans-serif" font-size="6.5" font-weight="500" fill="#cbd5e1">
      Trầy nhẹ viền • Đã dán chì
    </text>
    <text x="10" y="35" font-family="'Lexend', sans-serif" font-size="6" font-weight="700" fill="#38bdf8">
      # ẢNH CHỤP KIỂM ĐỊNH THỰC TẾ
    </text>
  </g>
</svg>
