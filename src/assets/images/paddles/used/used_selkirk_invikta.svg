<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Pickleball Blue Court Background -->
    <linearGradient id="courtBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>

    <!-- Court texture pattern -->
    <pattern id="courtTexture" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#38bdf8" fill-opacity="0.15"/>
      <circle cx="7" cy="7" r="1" fill="#0284c7" fill-opacity="0.2"/>
    </pattern>

    <!-- Yonex Neon Yellow Overgrip -->
    <linearGradient id="neonGrip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a3e635"/>
      <stop offset="50%" stop-color="#bef264"/>
      <stop offset="100%" stop-color="#84cc16"/>
    </linearGradient>

    <linearGradient id="redAirGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <filter id="paddleShadow2" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="5" dy="12" stdDeviation="9" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background: Pickleball Court Surface with White Boundary Line -->
  <rect width="400" height="400" rx="16" fill="url(#courtBlue)"/>
  <rect width="400" height="400" rx="16" fill="url(#courtTexture)"/>

  <!-- Court White Line (Tennis/Pickleball Kitchen Line angle) -->
  <line x1="-20" y1="310" x2="420" y2="290" stroke="#ffffff" stroke-width="12" stroke-opacity="0.85"/>
  <line x1="330" y1="0" x2="330" y2="400" stroke="#ffffff" stroke-width="8" stroke-opacity="0.5"/>

  <!-- Watermark: PickleMate Pre-Owned Verification -->
  <text x="200" y="388" text-anchor="middle" font-family="'Lexend', sans-serif" font-size="8" font-weight="700" fill="#bae6fd" letter-spacing="1">
    PICKLEMATE COURT-SIDE AUTHENTIC INSPECTION • SÀN GIAO DỊCH VỢT CŨ
  </text>

  <!-- Paddle Group (Angled for realistic pre-owned photo) -->
  <g transform="rotate(4 200 200)" filter="url(#paddleShadow2)">
    <!-- Handle (Wrapped with neon yellow Yonex Super Grap with overlap ridges) -->
    <rect x="187" y="240" width="26" height="115" rx="5" fill="url(#neonGrip)"/>
    <line x1="187" y1="255" x2="213" y2="262" stroke="#65a30d" stroke-width="1.6"/>
    <line x1="187" y1="272" x2="213" y2="279" stroke="#65a30d" stroke-width="1.6"/>
    <line x1="187" y1="289" x2="213" y2="296" stroke="#65a30d" stroke-width="1.6"/>
    <line x1="187" y1="306" x2="213" y2="313" stroke="#65a30d" stroke-width="1.6"/>
    <line x1="187" y1="323" x2="213" y2="330" stroke="#65a30d" stroke-width="1.6"/>
    <line x1="187" y1="340" x2="213" y2="347" stroke="#65a30d" stroke-width="1.6"/>

    <!-- Black electrical tape at collar -->
    <rect x="185" y="238" width="30" height="8" rx="1" fill="#18181b"/>
    <text x="200" y="244" text-anchor="middle" font-family="sans-serif" font-size="4" font-weight="bold" fill="#facc15">YONEX</text>

    <!-- Butt Cap -->
    <rect x="185" y="350" width="30" height="8" rx="3" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>

    <!-- Throat Triangle Outer -->
    <polygon points="187,242 165,205 235,205 213,242" fill="#18181b"/>

    <!-- SELKIRK ICONIC AIR DYNAMIC THROAT (THE REAL CUTOUT HOLE) -->
    <polygon points="190,230 178,208 222,208 210,230" fill="url(#courtBlue)"/>
    <polygon points="190,230 178,208 222,208 210,230" fill="url(#courtTexture)"/>

    <!-- Edgeless Aero-DuraEdge Paddle Body -->
    <path d="M 130,55 C 130,35 150,32 200,32 C 250,32 270,35 270,55 L 270,185 C 270,205 250,215 235,215 L 165,215 C 150,215 130,205 130,185 Z" fill="#09090b" stroke="#27272a" stroke-width="2"/>

    <!-- Inner Face Carbon & Aero Dynamic Swooshes -->
    <path d="M 133,57 C 133,39 152,36 200,36 C 248,36 267,39 267,57 L 267,183 C 267,201 248,211 233,211 L 167,211 C 152,211 133,201 133,183 Z" fill="#18181b"/>

    <!-- Red and Carbon Aerodynamic Swooshes -->
    <path d="M 135,130 Q 170,90 265,110 L 265,160 Q 180,140 135,175 Z" fill="url(#redAirGrad)" opacity="0.9"/>
    <path d="M 135,80 Q 200,60 265,85 L 265,100 Q 190,80 135,95 Z" fill="#f8fafc" opacity="0.85"/>

    <!-- Subtle edge tape applied by owner on left shoulder (băng dán chống va đập viền) -->
    <path d="M 130 55 Q 130 85 131 110" stroke="#f59e0b" stroke-width="3" fill="none" opacity="0.8"/>
    <text x="123" y="85" text-anchor="middle" transform="rotate(-90 123 85)" font-family="sans-serif" font-size="3.5" font-weight="bold" fill="#fef08a">EDGE TAPE</text>

    <!-- Selkirk Bold Typography -->
    <text x="200" y="115" text-anchor="middle" font-family="'Impact', sans-serif" font-size="22" font-weight="900" fill="#ffffff" letter-spacing="3">
      SELKIRK
    </text>

    <text x="200" y="130" text-anchor="middle" font-family="'Lexend', sans-serif" font-size="8.5" font-weight="800" fill="#fecaca" letter-spacing="1">
      POWER AIR INVIKTA
    </text>
    <text x="200" y="141" text-anchor="middle" font-family="'Lexend', sans-serif" font-size="6.5" font-weight="600" fill="#cbd5e1">
      PRO AIR DYNAMIC THROAT
    </text>
  </g>

  <!-- Authentic Pre-Owned Inspection Badge Overlay (Chợ Vợt Cũ) -->
  <g transform="translate(24, 24)">
    <rect width="120" height="42" rx="8" fill="#09090b" fill-opacity="0.9" stroke="#f97316" stroke-width="1.2"/>
    <circle cx="16" cy="16" r="6" fill="#f97316"/>
    <text x="16" y="18.5" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="900" fill="#ffffff">✓</text>
    <text x="28" y="15" font-family="'Lexend', sans-serif" font-size="8.5" font-weight="800" fill="#fed7aa">
      VỢT CŨ • 88%
    </text>
    <text x="28" y="24" font-family="'Lexend', sans-serif" font-size="6.5" font-weight="500" fill="#cbd5e1">
      Có dán bảo vệ viền • Cán Yonex
    </text>
    <text x="10" y="35" font-family="'Lexend', sans-serif" font-size="6" font-weight="700" fill="#38bdf8">
      # ẢNH CHỤP SÂN THỰC TẾ
    </text>
  </g>
</svg>
