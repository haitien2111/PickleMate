<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="sixZeroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="sixZeroShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="400" height="400" rx="16" fill="url(#sixZeroBg)"/>

  <text x="200" y="385" text-anchor="middle" font-family="'Lexend', sans-serif" font-size="8" font-weight="700" fill="#a5b4fc" letter-spacing="1">
    PICKLEMATE VERIFIED INSPECTION • SÀN VỢT CŨ PASS LẠI
  </text>

  <g transform="rotate(2 200 200)" filter="url(#sixZeroShadow)">
    <rect x="187" y="240" width="26" height="115" rx="5" fill="#f8fafc"/>
    <line x1="187" y1="256" x2="213" y2="264" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="187" y1="274" x2="213" y2="282" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="187" y1="292" x2="213" y2="300" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="187" y1="310" x2="213" y2="317" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="187" y1="328" x2="213" y2="335" stroke="#94a3b8" stroke-width="1.5"/>

    <rect x="185" y="238" width="30" height="8" rx="1" fill="#09090b"/>
    <rect x="185" y="350" width="30" height="8" rx="3" fill="#1e1b4b"/>

    <polygon points="187,242 165,212 235,212 213,242" fill="#18181b"/>

    <!-- Six Zero Aero Curvature body -->
    <rect x="122" y="40" width="156" height="180" rx="40" fill="#09090b" stroke="#6366f1" stroke-width="2"/>
    <rect x="126" y="44" width="148" height="172" rx="36" fill="#18181b"/>

    <!-- Double Diamond graphics -->
    <polygon points="200,68 214,84 200,100 186,84" fill="none" stroke="#818cf8" stroke-width="3"/>
    <polygon points="200,90 214,106 200,122 186,106" fill="none" stroke="#c7d2fe" stroke-width="3"/>

    <text x="200" y="142" text-anchor="middle" font-family="'Impact', sans-serif" font-size="22" font-weight="900" fill="#ffffff" letter-spacing="2">
      SIX ZERO
    </text>
    <text x="200" y="156" text-anchor="middle" font-family="'Lexend', sans-serif" font-size="8.5" font-weight="800" fill="#c7d2fe" letter-spacing="0.5">
      DOUBLE BLACK DIAMOND
    </text>
    <text x="200" y="167" text-anchor="middle" font-family="'Lexend', sans-serif" font-size="6.5" font-weight="600" fill="#94a3b8">
      16MM RAW CARBON THERMOFORMED
    </text>
  </g>

  <!-- Pre-Owned Badge -->
  <g transform="translate(24, 24)">
    <rect width="120" height="42" rx="8" fill="#09090b" fill-opacity="0.9" stroke="#6366f1" stroke-width="1.2"/>
    <circle cx="16" cy="16" r="6" fill="#6366f1"/>
    <text x="16" y="18.5" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="900" fill="#ffffff">✓</text>
    <text x="28" y="15" font-family="'Lexend', sans-serif" font-size="8.5" font-weight="800" fill="#c7d2fe">
      VỢT CŨ • 93%
    </text>
    <text x="28" y="24" font-family="'Lexend', sans-serif" font-size="6.5" font-weight="500" fill="#cbd5e1">
      Cạnh Thermoformed • Mặt nhám
    </text>
    <text x="10" y="35" font-family="'Lexend', sans-serif" font-size="6" font-weight="700" fill="#38bdf8">
      # ẢNH CHỤP KIỂM ĐỊNH THỰC TẾ
    </text>
  </g>
</svg>
