<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="zockerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="60%" stop-color="#052e16"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>

    <!-- Brown Leather Grip -->
    <linearGradient id="leatherGrip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="40%" stop-color="#92400e"/>
      <stop offset="80%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <filter id="zockerShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="400" height="400" rx="16" fill="url(#zockerBg)"/>

  <g stroke="#22c55e" stroke-width="0.8" opacity="0.3">
    <line x1="20" y1="20" x2="20" y2="380"/>
    <line x1="20" y1="80" x2="28" y2="80"/>
    <line x1="20" y1="160" x2="32" y2="160"/>
    <line x1="20" y1="240" x2="28" y2="240"/>
    <line x1="20" y1="320" x2="32" y2="320"/>
  </g>

  <text x="200" y="385" text-anchor="middle" font-family="'Lexend', sans-serif" font-size="8" font-weight="700" fill="#86efac" letter-spacing="1">
    PICKLEMATE VERIFIED INSPECTION • SÀN VỢT CŨ PASS LẠI
  </text>

  <!-- Paddle Group -->
  <g transform="rotate(-2 200 200)" filter="url(#zockerShadow)">
    <!-- Leather Grip wrap -->
    <rect x="187" y="240" width="26" height="115" rx="5" fill="url(#leatherGrip)"/>
    <line x1="187" y1="256" x2="213" y2="263" stroke="#451a03" stroke-width="1.8"/>
    <line x1="187" y1="274" x2="213" y2="281" stroke="#451a03" stroke-width="1.8"/>
    <line x1="187" y1="292" x2="213" y2="299" stroke="#451a03" stroke-width="1.8"/>
    <line x1="187" y1="310" x2="213" y2="317" stroke="#451a03" stroke-width="1.8"/>
    <line x1="187" y1="328" x2="213" y2="335" stroke="#451a03" stroke-width="1.8"/>

    <rect x="185" y="238" width="30" height="8" rx="1" fill="#18181b"/>
    <rect x="185" y="350" width="30" height="8" rx="3" fill="#27272a"/>

    <polygon points="187,242 165,212 235,212 213,242" fill="#18181b"/>

    <rect x="122" y="40" width="156" height="180" rx="40" fill="#09090b" stroke="#4ade80" stroke-width="2"/>
    <rect x="126" y="44" width="148" height="172" rx="36" fill="#18181b"/>

    <!-- Dynamic Z Speed graphic -->
    <polygon points="150,70 250,70 190,140 250,140 240,165 140,165 200,95 150,95" fill="#4ade80" opacity="0.35"/>

    <text x="200" y="118" text-anchor="middle" font-family="'Impact', sans-serif" font-size="24" font-weight="900" fill="#ffffff" letter-spacing="2">
      ZOCKER
    </text>
    <text x="200" y="136" text-anchor="middle" font-family="'Lexend', sans-serif" font-size="9" font-weight="800" fill="#86efac" letter-spacing="1">
      TITAN FORCE 14MM
    </text>
    <text x="200" y="148" text-anchor="middle" font-family="'Lexend', sans-serif" font-size="6.5" font-weight="600" fill="#cbd5e1">
      TITANIUM INFUSED CARBON
    </text>
  </g>

  <!-- Pre-Owned Badge -->
  <g transform="translate(24, 24)">
    <rect width="120" height="42" rx="8" fill="#09090b" fill-opacity="0.9" stroke="#f59e0b" stroke-width="1.2"/>
    <circle cx="16" cy="16" r="6" fill="#f59e0b"/>
    <text x="16" y="18.5" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="900" fill="#09090b">✓</text>
    <text x="28" y="15" font-family="'Lexend', sans-serif" font-size="8.5" font-weight="800" fill="#fde68a">
      VỢT CŨ • 89%
    </text>
    <text x="28" y="24" font-family="'Lexend', sans-serif" font-size="6.5" font-weight="500" fill="#cbd5e1">
      Đã cuốn cán da nâu • Đầm tay
    </text>
    <text x="10" y="35" font-family="'Lexend', sans-serif" font-size="6" font-weight="700" fill="#38bdf8">
      # ẢNH CHỤP KIỂM ĐỊNH THỰC TẾ
    </text>
  </g>
</svg>
