<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Paddle Face Gradient -->
    <linearGradient id="paddleFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Accent Gradient on Paddle -->
    <linearGradient id="paddleAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a3e635" />
      <stop offset="100%" stop-color="#65a30d" />
    </linearGradient>

    <!-- Grip Handle Gradient -->
    <linearGradient id="gripGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="40%" stop-color="#e2e8f0" />
      <stop offset="80%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="paddleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <g transform="rotate(-15 50 50)" filter="url(#paddleShadow)">
    <!-- Paddle Head Edge Guard (Outer thick border) -->
    <rect x="22" y="10" width="56" height="58" rx="20" fill="#020617" stroke="#334155" stroke-width="1.5" />

    <!-- Paddle Face (Carbon Fiber Textured Surface) -->
    <rect x="25" y="13" width="50" height="52" rx="17" fill="url(#paddleFace)" />

    <!-- Sweet Spot Dynamic Sport Graphic Stripes -->
    <path d="M 27 34 Q 50 26 73 34" stroke="url(#paddleAccent)" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <path d="M 30 42 Q 50 36 70 42" stroke="#ffffff" stroke-opacity="0.8" stroke-width="2.2" stroke-linecap="round" fill="none" />
    <circle cx="50" cy="40" r="3" fill="#a3e635" />

    <!-- Neck Transition -->
    <path d="M 43 68 L 41 74 L 59 74 L 57 68 Z" fill="#020617" />

    <!-- Grip Handle Base -->
    <rect x="42" y="73" width="16" height="23" rx="3.5" fill="url(#gripGradient)" stroke="#0f172a" stroke-width="1" />
    
    <!-- Grip Tape Ribbons (Athletic wrap) -->
    <line x1="42" y1="77" x2="58" y2="80" stroke="#0f172a" stroke-width="1.8" />
    <line x1="42" y1="82" x2="58" y2="85" stroke="#0f172a" stroke-width="1.8" />
    <line x1="42" y1="87" x2="58" y2="90" stroke="#0f172a" stroke-width="1.8" />
    <line x1="42" y1="92" x2="58" y2="95" stroke="#0f172a" stroke-width="1.8" />

    <!-- Handle Butt Cap (Rubber end) with lime accent -->
    <rect x="40" y="93" width="20" height="4" rx="2" fill="#84cc16" stroke="#020617" stroke-width="1" />
  </g>
</svg>
